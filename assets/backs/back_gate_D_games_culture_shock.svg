<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card back — Gate D. Reused for every card (question and answer) of this gate.
  Artboard: 62 × 93 mm = 56 × 87 mm trim + 3 mm bleed on every edge (1 user unit = 1 mm).
  Trim line: x 3–59, y 3–90. Frame sits 3.5 mm inside the trim.
  Colours come from design/tokens.css when this file is inlined; the fallback hex values below
  are the same approved palette, so the file also renders correctly on its own (Canva, Inkscape, browsers).
  Text is live (editable) — no outlines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="62mm" height="93mm" viewBox="0 0 62 93" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card back, Gate D: Games from Countries &amp; Culture Shock">
  <title>Gate D — Games from Countries &amp; Culture Shock</title>
  <style>
    .bkD-field { fill: var(--gate-D-field,#0B6F79); }
    .bkD-ink { fill: var(--gate-D-ink,#FFFFFF); }
    .bkD-ink-line { fill: none; stroke: var(--gate-D-ink,#FFFFFF); stroke-width: 0.45; }
    .bkD-ink-stroke { stroke: var(--gate-D-ink,#FFFFFF); stroke-width: 0.4; stroke-linejoin: round; }
    .bkD-disc { fill: var(--c-yellow,#FFC93C); }
    .bkD-icon { fill: none; stroke: var(--c-navy,#0B2545); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .bkD-icon-fill { fill: var(--c-navy,#0B2545); }
    .bkD-accent { fill: var(--gate-D-accent,#FFC93C); }
    .bkD-accent-stroke { stroke: var(--gate-D-ink,#FFFFFF); stroke-width: 0.35; stroke-linejoin: round; }
    .bkD-accent-line { fill: none; stroke: var(--gate-D-accent,#FFC93C); stroke-width: 0.7; stroke-linecap: round; }
    .bkD-sign { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  </style>

  <!-- 1. Background (fills the bleed) -->
  <rect class="bkD-field" x="0" y="0" width="62" height="93"/>

  <!-- 2. Frame -->
  <rect class="bkD-ink-line" x="6.5" y="6.5" width="49" height="80" rx="3"/>

  <!-- 3. Shared header: flight path + plane + event name -->
  <circle class="bkD-ink" cx="18.6" cy="11.2" r="0.55"/>
  <line class="bkD-ink-line" x1="20" y1="11.2" x2="27.6" y2="11.2" stroke-dasharray="0.9 0.8" stroke-width="0.35"/>
  <path class="bkD-ink" transform="translate(31 11.2) rotate(90) scale(0.2) translate(-12 -12)" d="M12 2C12.9 2 13.4 2.9 13.4 4V9.2L21.5 13.6V15.6L13.4 13.2V18.4L15.6 20V21.6L12 20.7L8.4 21.6V20L10.6 18.4V13.2L2.5 15.6V13.6L10.6 9.2V4C10.6 2.9 11.1 2 12 2Z"/>
  <text class="bkD-ink bkD-sign" x="31" y="17.4" font-size="2.5" letter-spacing="0.55" text-anchor="middle">INTERNATIONAL FAIR</text>

  <!-- 4. Gate motif -->
  <circle class="bkD-disc" cx="31" cy="37.5" r="13.5"/>
    <!-- Motif: a die -->
    <g transform="rotate(-12 31 37.5)">
      <rect class="bkD-icon" x="24" y="30.5" width="14" height="14" rx="2.6"/>
      <circle class="bkD-icon-fill" cx="27.4" cy="33.9" r="1.05"/>
      <circle class="bkD-icon-fill" cx="34.6" cy="33.9" r="1.05"/>
      <circle class="bkD-icon-fill" cx="31" cy="37.5" r="1.05"/>
      <circle class="bkD-icon-fill" cx="27.4" cy="41.1" r="1.05"/>
      <circle class="bkD-icon-fill" cx="34.6" cy="41.1" r="1.05"/>
    </g>

    <!-- Accent: two turning arrows (adapting) -->
    <path class="bkD-accent-line" d="M41.9 23.2a2.6 2.6 0 0 1 4.6-1.6M47.1 23.8a2.6 2.6 0 0 1-4.6 1.6"/>
    <path class="bkD-accent" d="M47.4 20.4l-.1 2.2-2.1-.6zM41.6 26.6l.1-2.2 2.1.6z"/>

  <!-- 5. Gate label -->
  <text class="bkD-ink bkD-sign" x="31" y="58.6" font-size="3" letter-spacing="1.4" text-anchor="middle">GATE</text>
  <text class="bkD-ink bkD-sign" x="31" y="74.6" font-size="15.5" font-weight="800" text-anchor="middle">D</text>
  <rect class="bkD-accent" x="26" y="77.1" width="10" height="0.8" rx="0.4"/>
  <text class="bkD-ink bkD-sign" x="31" y="81.3" font-size="2.35" letter-spacing="0.25" text-anchor="middle">GAMES · CULTURE SHOCK</text>
  <text class="bkD-ink bkD-sign" x="31" y="84.2" font-size="2.35" letter-spacing="0.25" text-anchor="middle">JEUX DU MONDE · CHOC CULTUREL</text>
</svg>
