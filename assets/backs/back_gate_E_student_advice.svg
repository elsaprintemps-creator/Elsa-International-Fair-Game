<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card back — Gate E. Reused for every card (question and answer) of this gate.
  Artboard: 62 × 93 mm = 56 × 87 mm trim + 3 mm bleed on every edge (1 user unit = 1 mm).
  Trim line: x 3–59, y 3–90. Frame sits 3.5 mm inside the trim.
  Colours come from design/tokens.css when this file is inlined; the fallback hex values below
  are the same approved palette, so the file also renders correctly on its own (Canva, Inkscape, browsers).
  Text is live (editable) — no outlines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="62mm" height="93mm" viewBox="0 0 62 93" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card back, Gate E: Student Advice: Living Abroad, Adapting &amp; Making Friends">
  <title>Gate E — Student Advice: Living Abroad, Adapting &amp; Making Friends</title>
  <style>
    .bkE-field { fill: var(--gate-E-field,#6D071A); }
    .bkE-ink { fill: var(--gate-E-ink,#FFFFFF); }
    .bkE-ink-line { fill: none; stroke: var(--gate-E-ink,#FFFFFF); stroke-width: 0.45; }
    .bkE-ink-stroke { stroke: var(--gate-E-ink,#FFFFFF); stroke-width: 0.4; stroke-linejoin: round; }
    .bkE-disc { fill: var(--c-white,#FFFFFF); }
    .bkE-icon { fill: none; stroke: var(--c-navy,#0B2545); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .bkE-icon-fill { fill: var(--c-navy,#0B2545); }
    .bkE-icon-stroke { stroke: var(--c-navy,#0B2545); stroke-width: 0.4; stroke-linejoin: round; }
    .bkE-accent { fill: var(--gate-E-accent,#FFC93C); }
    .bkE-accent-stroke { stroke: var(--gate-E-ink,#FFFFFF); stroke-width: 0.35; stroke-linejoin: round; }
    .bkE-accent-line { fill: none; stroke: var(--gate-E-accent,#FFC93C); stroke-width: 0.7; stroke-linecap: round; }
    .bkE-sign { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  </style>

  <!-- 1. Background (fills the bleed) -->
  <rect class="bkE-field" x="0" y="0" width="62" height="93"/>

  <!-- 2. Frame -->
  <rect class="bkE-ink-line" x="6.5" y="6.5" width="49" height="80" rx="3"/>

  <!-- 3. Shared header: flight path + plane + event name -->
  <circle class="bkE-ink" cx="18.6" cy="11.2" r="0.55"/>
  <line class="bkE-ink-line" x1="20" y1="11.2" x2="27.6" y2="11.2" stroke-dasharray="0.9 0.8" stroke-width="0.35"/>
  <path class="bkE-ink" transform="translate(31 11.2) rotate(90) scale(0.2) translate(-12 -12)" d="M12 2C12.9 2 13.4 2.9 13.4 4V9.2L21.5 13.6V15.6L13.4 13.2V18.4L15.6 20V21.6L12 20.7L8.4 21.6V20L10.6 18.4V13.2L2.5 15.6V13.6L10.6 9.2V4C10.6 2.9 11.1 2 12 2Z"/>
  <text class="bkE-ink bkE-sign" x="31" y="17.4" font-size="2.5" letter-spacing="0.55" text-anchor="middle">INTERNATIONAL FAIR</text>

  <!-- 4. Gate motif -->
  <circle class="bkE-disc" cx="31" cy="37.5" r="13.5"/>
    <!-- Motif: two students talking (linked speech bubbles) -->
    <path class="bkE-icon" d="M22.2 29.8h9.8a2.2 2.2 0 0 1 2.2 2.2v4.4a2.2 2.2 0 0 1-2.2 2.2h-5.4l-2.8 2.6v-2.6h-1.6a2.2 2.2 0 0 1-2.2-2.2V32a2.2 2.2 0 0 1 2.2-2.2z"/>
    <path class="bkE-accent bkE-icon-stroke" d="M30.4 36h8.6a2.2 2.2 0 0 1 2.2 2.2v4.2a2.2 2.2 0 0 1-2.2 2.2h-.8v2.6l-2.8-2.6h-5a2.2 2.2 0 0 1-2.2-2.2v-4.2a2.2 2.2 0 0 1 2.2-2.2z"/>
    <circle class="bkE-icon-fill" cx="31.9" cy="40.3" r="0.65"/><circle class="bkE-icon-fill" cx="34.7" cy="40.3" r="0.65"/><circle class="bkE-icon-fill" cx="37.5" cy="40.3" r="0.65"/>

    <!-- Accent: compass (finding your way) -->
    <circle class="bkE-ink-line" cx="44.5" cy="23.5" r="2.7"/>
    <path class="bkE-accent bkE-ink-stroke" d="M44.5 21.1L45.3 23.5L44.5 25.9L43.7 23.5Z"/>

  <!-- 5. Gate label -->
  <text class="bkE-ink bkE-sign" x="31" y="58.6" font-size="3" letter-spacing="1.4" text-anchor="middle">GATE</text>
  <text class="bkE-ink bkE-sign" x="31" y="74.6" font-size="15.5" font-weight="800" text-anchor="middle">E</text>
  <rect class="bkE-accent" x="26" y="77.1" width="10" height="0.8" rx="0.4"/>
  <text class="bkE-ink bkE-sign" x="31" y="81.3" font-size="2.35" letter-spacing="0.25" text-anchor="middle">STUDENT ADVICE · LIVING ABROAD</text>
  <text class="bkE-ink bkE-sign" x="31" y="84.2" font-size="2.35" letter-spacing="0.25" text-anchor="middle">CONSEILS · VIVRE À L’ÉTRANGER</text>
</svg>
