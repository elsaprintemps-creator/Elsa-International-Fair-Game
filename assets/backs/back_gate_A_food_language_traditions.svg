<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card back — Gate A. Reused for every card (question and answer) of this gate.
  Artboard: 62 × 93 mm = 56 × 87 mm trim + 3 mm bleed on every edge (1 user unit = 1 mm).
  Trim line: x 3–59, y 3–90. Frame sits 3.5 mm inside the trim.
  Colours come from design/tokens.css when this file is inlined; the fallback hex values below
  are the same approved palette, so the file also renders correctly on its own (Canva, Inkscape, browsers).
  Text is live (editable) — no outlines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="62mm" height="93mm" viewBox="0 0 62 93" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card back, Gate A: Food, Language &amp; Traditions">
  <title>Gate A — Food, Language &amp; Traditions</title>
  <style>
    .bkA-field { fill: var(--gate-A-field,#1FB5BE); }
    .bkA-ink { fill: var(--gate-A-ink,#0B2545); }
    .bkA-ink-line { fill: none; stroke: var(--gate-A-ink,#0B2545); stroke-width: 0.45; }
    .bkA-ink-stroke { stroke: var(--gate-A-ink,#0B2545); stroke-width: 0.4; stroke-linejoin: round; }
    .bkA-disc { fill: var(--c-white,#FFFFFF); }
    .bkA-icon { fill: none; stroke: var(--c-navy,#0B2545); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .bkA-icon-fill { fill: var(--c-navy,#0B2545); }
    .bkA-accent { fill: var(--gate-A-accent,#FFC93C); }
    .bkA-accent-stroke { stroke: var(--gate-A-ink,#0B2545); stroke-width: 0.35; stroke-linejoin: round; }
    .bkA-accent-line { fill: none; stroke: var(--gate-A-accent,#FFC93C); stroke-width: 0.7; stroke-linecap: round; }
    .bkA-sign { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  </style>

  <!-- 1. Background (fills the bleed) -->
  <rect class="bkA-field" x="0" y="0" width="62" height="93"/>

  <!-- 2. Frame -->
  <rect class="bkA-ink-line" x="6.5" y="6.5" width="49" height="80" rx="3"/>

  <!-- 3. Shared header: flight path + plane + event name -->
  <circle class="bkA-ink" cx="18.6" cy="11.2" r="0.55"/>
  <line class="bkA-ink-line" x1="20" y1="11.2" x2="27.6" y2="11.2" stroke-dasharray="0.9 0.8" stroke-width="0.35"/>
  <path class="bkA-ink" transform="translate(31 11.2) rotate(90) scale(0.2) translate(-12 -12)" d="M12 2C12.9 2 13.4 2.9 13.4 4V9.2L21.5 13.6V15.6L13.4 13.2V18.4L15.6 20V21.6L12 20.7L8.4 21.6V20L10.6 18.4V13.2L2.5 15.6V13.6L10.6 9.2V4C10.6 2.9 11.1 2 12 2Z"/>
  <text class="bkA-ink bkA-sign" x="31" y="17.4" font-size="2.5" letter-spacing="0.55" text-anchor="middle">INTERNATIONAL FAIR</text>

  <!-- 4. Gate motif -->
  <circle class="bkA-disc" cx="31" cy="37.5" r="13.5"/>
    <!-- Motif: plate with fork and knife -->
    <circle class="bkA-icon" cx="31" cy="37.6" r="6"/>
    <circle class="bkA-icon" cx="31" cy="37.6" r="3.9" stroke-width="0.6"/>
    <path class="bkA-icon" d="M21 29.6V33M22.2 29.6V33M23.4 29.6V33M21 33Q21 34.9 22.2 34.9Q23.4 34.9 23.4 33M22.2 34.9V45.6"/>
    <path class="bkA-icon" d="M39.6 45.6V29.6C41.6 30.6 42.1 33.6 41.7 36.6H39.6"/>

    <!-- Accent: speech bubble (language) -->
    <path class="bkA-accent bkA-accent-stroke" d="M42 21.2h5a1.3 1.3 0 0 1 1.3 1.3v2.4a1.3 1.3 0 0 1-1.3 1.3h-2.6l-1.7 1.5v-1.5H42a1.3 1.3 0 0 1-1.3-1.3v-2.4a1.3 1.3 0 0 1 1.3-1.3z"/>

  <!-- 5. Gate label -->
  <text class="bkA-ink bkA-sign" x="31" y="58.6" font-size="3" letter-spacing="1.4" text-anchor="middle">GATE</text>
  <text class="bkA-ink bkA-sign" x="31" y="74.6" font-size="15.5" font-weight="800" text-anchor="middle">A</text>
  <rect class="bkA-accent" x="26" y="77.1" width="10" height="0.8" rx="0.4"/>
  <text class="bkA-ink bkA-sign" x="31" y="81.3" font-size="2.35" letter-spacing="0.25" text-anchor="middle">FOOD · LANGUAGE · TRADITIONS</text>
  <text class="bkA-ink bkA-sign" x="31" y="84.2" font-size="2.35" letter-spacing="0.25" text-anchor="middle">CUISINE · LANGUES · TRADITIONS</text>
</svg>
