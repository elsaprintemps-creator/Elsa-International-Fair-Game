<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card back — Gate C. Reused for every card (question and answer) of this gate.
  Artboard: 62 × 93 mm = 56 × 87 mm trim + 3 mm bleed on every edge (1 user unit = 1 mm).
  Trim line: x 3–59, y 3–90. Frame sits 3.5 mm inside the trim.
  Colours come from design/tokens.css when this file is inlined; the fallback hex values below
  are the same approved palette, so the file also renders correctly on its own (Canva, Inkscape, browsers).
  Text is live (editable) — no outlines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="62mm" height="93mm" viewBox="0 0 62 93" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card back, Gate C: Random Questions &amp; General Knowledge">
  <title>Gate C — Random Questions &amp; General Knowledge</title>
  <style>
    .bkC-field { fill: var(--gate-C-field,#FFC93C); }
    .bkC-ink { fill: var(--gate-C-ink,#0B2545); }
    .bkC-ink-line { fill: none; stroke: var(--gate-C-ink,#0B2545); stroke-width: 0.45; }
    .bkC-ink-stroke { stroke: var(--gate-C-ink,#0B2545); stroke-width: 0.4; stroke-linejoin: round; }
    .bkC-disc { fill: var(--c-navy,#0B2545); }
    .bkC-icon { fill: none; stroke: var(--c-yellow,#FFC93C); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .bkC-icon-fill { fill: var(--c-yellow,#FFC93C); }
    .bkC-accent { fill: var(--gate-C-accent,#1FB5BE); }
    .bkC-accent-stroke { stroke: var(--gate-C-ink,#0B2545); stroke-width: 0.35; stroke-linejoin: round; }
    .bkC-accent-line { fill: none; stroke: var(--gate-C-accent,#1FB5BE); stroke-width: 0.7; stroke-linecap: round; }
    .bkC-sign { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  </style>

  <!-- 1. Background (fills the bleed) -->
  <rect class="bkC-field" x="0" y="0" width="62" height="93"/>

  <!-- 2. Frame -->
  <rect class="bkC-ink-line" x="6.5" y="6.5" width="49" height="80" rx="3"/>

  <!-- 3. Shared header: flight path + plane + event name -->
  <circle class="bkC-ink" cx="18.6" cy="11.2" r="0.55"/>
  <line class="bkC-ink-line" x1="20" y1="11.2" x2="27.6" y2="11.2" stroke-dasharray="0.9 0.8" stroke-width="0.35"/>
  <path class="bkC-ink" transform="translate(31 11.2) rotate(90) scale(0.2) translate(-12 -12)" d="M12 2C12.9 2 13.4 2.9 13.4 4V9.2L21.5 13.6V15.6L13.4 13.2V18.4L15.6 20V21.6L12 20.7L8.4 21.6V20L10.6 18.4V13.2L2.5 15.6V13.6L10.6 9.2V4C10.6 2.9 11.1 2 12 2Z"/>
  <text class="bkC-ink bkC-sign" x="31" y="17.4" font-size="2.5" letter-spacing="0.55" text-anchor="middle">INTERNATIONAL FAIR</text>

  <!-- 4. Gate motif -->
  <circle class="bkC-disc" cx="31" cy="37.5" r="13.5"/>
    <!-- Motif: light bulb with a question mark -->
    <path class="bkC-icon" d="M27.6 43C27.6 40.6 24.4 39.2 24.4 34.6a6.6 6.6 0 0 1 13.2 0c0 4.6-3.2 6-3.2 8.4Z"/>
    <path class="bkC-icon" d="M28 45.3H34M28.8 47.5H33.2"/>
    <path class="bkC-icon" d="M28.9 33.2a2.2 2.2 0 1 1 3.3 1.9c-.8.45-1.2.95-1.2 1.9" stroke-width="0.95"/>
    <circle class="bkC-icon-fill" cx="31" cy="39.3" r="0.6"/>

    <!-- Accent: sparkle (surprise) -->
    <path class="bkC-accent bkC-accent-stroke" d="M44.5 20Q44.9 23.1 48 23.5Q44.9 23.9 44.5 27Q44.1 23.9 41 23.5Q44.1 23.1 44.5 20Z"/>

  <!-- 5. Gate label -->
  <text class="bkC-ink bkC-sign" x="31" y="58.6" font-size="3" letter-spacing="1.4" text-anchor="middle">GATE</text>
  <text class="bkC-ink bkC-sign" x="31" y="74.6" font-size="15.5" font-weight="800" text-anchor="middle">C</text>
  <rect class="bkC-accent" x="26" y="77.1" width="10" height="0.8" rx="0.4"/>
  <text class="bkC-ink bkC-sign" x="31" y="81.3" font-size="2.35" letter-spacing="0.25" text-anchor="middle">RANDOM · GENERAL KNOWLEDGE</text>
  <text class="bkC-ink bkC-sign" x="31" y="84.2" font-size="2.35" letter-spacing="0.25" text-anchor="middle">SURPRISES · CULTURE GÉNÉRALE</text>
</svg>
