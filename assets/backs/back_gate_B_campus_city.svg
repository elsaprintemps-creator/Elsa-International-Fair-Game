<?xml version="1.0" encoding="UTF-8"?>
<!--
  Card back — Gate B. Reused for every card (question and answer) of this gate.
  Artboard: 62 × 93 mm = 56 × 87 mm trim + 3 mm bleed on every edge (1 user unit = 1 mm).
  Trim line: x 3–59, y 3–90. Frame sits 3.5 mm inside the trim.
  Colours come from design/tokens.css when this file is inlined; the fallback hex values below
  are the same approved palette, so the file also renders correctly on its own (Canva, Inkscape, browsers).
  Text is live (editable) — no outlines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="62mm" height="93mm" viewBox="0 0 62 93" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card back, Gate B: Campus Life &amp; City Information">
  <title>Gate B — Campus Life &amp; City Information</title>
  <style>
    .bkB-field { fill: var(--gate-B-field,#0B2545); }
    .bkB-ink { fill: var(--gate-B-ink,#FFFFFF); }
    .bkB-ink-line { fill: none; stroke: var(--gate-B-ink,#FFFFFF); stroke-width: 0.45; }
    .bkB-ink-stroke { stroke: var(--gate-B-ink,#FFFFFF); stroke-width: 0.4; stroke-linejoin: round; }
    .bkB-disc { fill: var(--c-turquoise,#1FB5BE); }
    .bkB-icon { fill: none; stroke: var(--c-navy,#0B2545); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .bkB-icon-fill { fill: var(--c-navy,#0B2545); }
    .bkB-accent { fill: var(--gate-B-accent,#FFC93C); }
    .bkB-accent-stroke { stroke: var(--gate-B-ink,#FFFFFF); stroke-width: 0.35; stroke-linejoin: round; }
    .bkB-accent-line { fill: none; stroke: var(--gate-B-accent,#FFC93C); stroke-width: 0.7; stroke-linecap: round; }
    .bkB-sign { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; }
  </style>

  <!-- 1. Background (fills the bleed) -->
  <rect class="bkB-field" x="0" y="0" width="62" height="93"/>

  <!-- 2. Frame -->
  <rect class="bkB-ink-line" x="6.5" y="6.5" width="49" height="80" rx="3"/>

  <!-- 3. Shared header: flight path + plane + event name -->
  <circle class="bkB-ink" cx="18.6" cy="11.2" r="0.55"/>
  <line class="bkB-ink-line" x1="20" y1="11.2" x2="27.6" y2="11.2" stroke-dasharray="0.9 0.8" stroke-width="0.35"/>
  <path class="bkB-ink" transform="translate(31 11.2) rotate(90) scale(0.2) translate(-12 -12)" d="M12 2C12.9 2 13.4 2.9 13.4 4V9.2L21.5 13.6V15.6L13.4 13.2V18.4L15.6 20V21.6L12 20.7L8.4 21.6V20L10.6 18.4V13.2L2.5 15.6V13.6L10.6 9.2V4C10.6 2.9 11.1 2 12 2Z"/>
  <text class="bkB-ink bkB-sign" x="31" y="17.4" font-size="2.5" letter-spacing="0.55" text-anchor="middle">INTERNATIONAL FAIR</text>

  <!-- 4. Gate motif -->
  <circle class="bkB-disc" cx="31" cy="37.5" r="13.5"/>
    <!-- Motif: campus building -->
    <path class="bkB-icon" d="M21.5 33.2L31 27.6L40.5 33.2Z"/>
    <path class="bkB-icon" d="M22.5 35H39.5M24.6 36.8V44M29 36.8V44M33 36.8V44M37.4 36.8V44M22.5 45.7H39.5M21 47.5H41"/>

    <!-- Accent: map pin (city) -->
    <path class="bkB-accent" d="M44.5 27.4C42.7 25.3 41.8 23.9 41.8 22.6a2.7 2.7 0 0 1 5.4 0c0 1.3-.9 2.7-2.7 4.8z"/>
    <circle class="bkB-field" cx="44.5" cy="22.6" r="0.9"/>

  <!-- 5. Gate label -->
  <text class="bkB-ink bkB-sign" x="31" y="58.6" font-size="3" letter-spacing="1.4" text-anchor="middle">GATE</text>
  <text class="bkB-ink bkB-sign" x="31" y="74.6" font-size="15.5" font-weight="800" text-anchor="middle">B</text>
  <rect class="bkB-accent" x="26" y="77.1" width="10" height="0.8" rx="0.4"/>
  <text class="bkB-ink bkB-sign" x="31" y="81.3" font-size="2.35" letter-spacing="0.25" text-anchor="middle">CAMPUS LIFE · CITY INFO</text>
  <text class="bkB-ink bkB-sign" x="31" y="84.2" font-size="2.35" letter-spacing="0.25" text-anchor="middle">VIE DE CAMPUS · INFOS VILLE</text>
</svg>
